<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة درجات المدرسة الشامل</title>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --danger: #d93025;
            --danger-hover: #b3261e;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #202124;
            --subtext: #5f6368;
            --border: #dadce0;
            --badge-bg: #e8f0fe;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px 15px;
            direction: rtl;
        }

        .container {
            max-width: 550px;
            margin: 10px auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }

        /* إحصائيات سريعة */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-card h4 {
            font-size: 13px;
            color: var(--subtext);
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
        }

        /* النموذج */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button.btn-add {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }

        button.btn-add:hover {
            background-color: var(--primary-hover);
        }

        .divider {
            margin: 25px 0;
            border: none;
            border-top: 1px solid var(--border);
        }

        /* البحث والتصفية */
        .search-box {
            margin-bottom: 15px;
        }

        /* القائمة */
        ul {
            list-style: none;
        }

        li {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 14px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .student-name {
            font-weight: bold;
            font-size: 16px;
        }

        .details-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 13px;
        }

        .grade-badge {
            background: var(--badge-bg);
            color: var(--primary);
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 6px;
        }

        .subject-tag {
            color: var(--subtext);
            background: #e0e0e0;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 18px;
            padding: 6px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background: #fce8e6;
        }

        .empty-msg {
            text-align: center;
            color: var(--subtext);
            padding: 20px 0;
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>نظام إدارة درجات الطلاب</h2>

        <!-- ملخص الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <h4>إجمالي الطلاب</h4>
                <p id="totalCount">0</p>
            </div>
            <div class="stat-card">
                <h4>متوسط الدرجات</h4>
                <p id="avgGrade">0</p>
            </div>
        </div>
        
        <!-- نموذج إضافة طالب -->
        <div class="form-group">
            <label for="studentName">اسم الطالب</label>
            <input type="text" id="studentName" placeholder="أدخل اسم الطالب الرباعي">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="studentGrade">الدرجة</label>
                <input type="number" id="studentGrade" placeholder="مثال: 95" min="0" max="100">
            </div>
            <div class="form-group">
                <label for="subjectSelect">المادة</label>
                <select id="subjectSelect">
                    <option value="عام">عام</option>
                    <option value="رياضيات">رياضيات</option>
                    <option value="علوم">علوم</option>
                    <option value="لغة عربية">لغة عربية</option>
                    <option value="لغة إنجليزية">لغة إنجليزية</option>
                </select>
            </div>
        </div>

        <button class="btn-add" id="saveBtn">حفظ الطالب</button>

        <hr class="divider">

        <!-- حقل البحث الفوري -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 بحث باسم الطالب أو المادة...">
        </div>

        <h3>قائمة الطلاب المسجلين</h3>
        <ul id="dataList" style="margin-top: 15px;">
            <li class="empty-msg">جاري الاتصال بقاعدة البيانات...</li>
        </ul>
    </div>

    <!-- ربط Firebase SDK v10.8.0 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyDMusCd7XWnzwgDYlaAJJxi6-LCfHniu64",
            authDomain: "school-system-53654.firebaseapp.com",
            projectId: "school-system-53654",
            storageBucket: "school-system-53654.firebasestorage.app",
            messagingSenderId: "1070744883084",
            appId: "1:1070744883084:web:a92f8241e27f2aeeca10a9",
            measurementId: "G-1KNJ0D6PN3"
        };

        // تهيئة التطبيق والقاعدة
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // عناصر الواجهة
        const nameInput = document.getElementById('studentName');
        const gradeInput = document.getElementById('studentGrade');
        const subjectSelect = document.getElementById('subjectSelect');
        const saveBtn = document.getElementById('saveBtn');
        const searchInput = document.getElementById('searchInput');
        const list = document.getElementById('dataList');
        const totalCountEl = document.getElementById('totalCount');
        const avgGradeEl = document.getElementById('avgGrade');

        let allStudents = [];

        // 1. إضافة طالب جديد
        saveBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            const grade = gradeInput.value.trim();
            const subject = subjectSelect.value;

            if (!name || !grade) {
                alert("يرجى إدخال اسم الطالب والدرجة أولاً!");
                return;
            }

            if (Number(grade) < 0 || Number(grade) > 100) {
                alert("يرجى كتابة درجة صحيحة بين 0 و 100");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = "جاري الحفظ...";

            try {
                await addDoc(collection(db, "students"), {
                    name: name,
                    grade: Number(grade),
                    subject: subject,
                    createdAt: new Date()
                });
                nameInput.value = '';
                gradeInput.value = '';
                subjectSelect.selectedIndex = 0;
            } catch (error) {
                console.error("خطأ أثناء الحفظ:", error);
                alert("حدث خطأ أثناء حفظ البيانات.");
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = "حفظ الطالب";
            }
        });

        // 2. الاستماع الفوري والتحديث عند تغيير البيانات في Firebase
        const q = query(collection(db, "students"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            allStudents = [];
            snapshot.forEach((docSnap) => {
                allStudents.push({ id: docSnap.id, ...docSnap.data() });
            });
            updateStats(allStudents);
            renderList(allStudents);
        }, (error) => {
            console.error("خطأ في الاتصال:", error);
            list.innerHTML = '<li class="empty-msg">حدث خطأ في جلب البيانات من الخادم</li>';
        });

        // 3. تحديث بطاقات الإحصائيات (العدد والمتوسط)
        function updateStats(students) {
            totalCountEl.textContent = students.length;
            if (students.length === 0) {
                avgGradeEl.textContent = '0';
                return;
            }
            const sum = students.reduce((acc, curr) => acc + (Number(curr.grade) || 0), 0);
            const avg = (sum / students.length).toFixed(1);
            avgGradeEl.textContent = avg;
        }

        // 4. عرض القائمة في الصفحة
        function renderList(students) {
            list.innerHTML = '';
            if (students.length === 0) {
                list.innerHTML = '<li class="empty-msg">لا توجد نتائج مسجلة</li>';
                return;
            }

            students.forEach((student) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="student-info">
                        <span class="student-name">${student.name}</span>
                        <div class="details-wrapper">
                            <span class="grade-badge">الدرجة: ${student.grade}</span>
                            <span class="subject-tag">${student.subject || 'عام'}</span>
                        </div>
                    </div>
                    <button class="btn-delete" title="حذف الطالب" data-id="${student.id}">🗑️</button>
                `;

                // إضافة حدث الحذف لكل عنصر
                li.querySelector('.btn-delete').addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    if (confirm(`هل أنت تأكد من حذف بيانات الطالب (${student.name})؟`)) {
                        try {
                            await deleteDoc(doc(db, "students", id));
                        } catch (err) {
                            alert("تعذر الحذف، يرجى المحاولة لاحقاً.");
                        }
                    }
                });

                list.appendChild(li);
            });
        }

        // 5. البحث الفوري بالاسم أو المادة
        searchInput.addEventListener('input', (e) => {
            const filterText = e.target.value.toLowerCase().trim();
            const filtered = allStudents.filter(s => 
                s.name.toLowerCase().includes(filterText) || 
                (s.subject && s.subject.toLowerCase().includes(filterText))
            );
            renderList(filtered);
        });
    </script>
</body>
</html>
